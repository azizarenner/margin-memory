services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: margin
      POSTGRES_DB: margin_memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin -d margin_memory"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://margin:${POSTGRES_PASSWORD}@db:5432/margin_memory
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
